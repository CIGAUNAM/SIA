<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{% block titulo %}{% endblock %}</title>
<style>
  @page {
    size: letter;
    margin: 2.2cm 2cm 2.2cm 2cm;
    @bottom-left { content: string(pie); font-size: 8pt; color: #666; }
    @bottom-right { content: counter(page) " de " counter(pages); font-size: 8pt; color: #666; }
  }
  html { font-family: "Source Serif 4", "Georgia", "Times New Roman", serif; font-size: 10.5pt; line-height: 1.4; color: #111; }
  body { margin: 0; }
  h1, h2, h3 { font-family: "Helvetica Neue", Arial, sans-serif; line-height: 1.2; }
  .encabezado { text-align: center; margin-bottom: 1.2em; }
  .encabezado h1 { font-size: 18pt; margin: 0 0 .2em; }
  .encabezado p { margin: .1em 0; color: #444; }
  .campo-recuadro { border: 1px solid #999; padding: .5em .7em; margin: .3em 0 .8em; white-space: pre-line; }
  table.datos { border-collapse: collapse; margin: .5em 0 1em; }
  table.datos th { text-align: left; padding: .15em 1em .15em 0; font-weight: 600; vertical-align: top; white-space: nowrap; }
  table.datos td { padding: .15em 0; }
  @media screen { body { max-width: 21cm; margin: 2em auto; padding: 0 1.5em; } }
  {% block estilos %}{% endblock %}
</style>
</head>
<body>
{% block contenido %}{% endblock %}
</body>
</html>
